<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="costintel-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="45%" stop-color="#5b6bff"/>
      <stop offset="85%" stop-color="#3b9eff"/>
      <stop offset="100%" stop-color="#2ee6a6"/>
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="shield-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Subtle Inner Gradient for Shield Fill -->
    <linearGradient id="shield-inner-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base (1:1 Ratio) -->
  <rect width="512" height="512" rx="116" fill="url(#costintel-bg)"/>

  <!-- Inner Highlight Border -->
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="6"/>

  <!-- Glowing Shield Layer (Ambient Bloom) -->
  <path
    d="M 256 122
       C 298 144 350 148 376 150
       C 380 258 358 338 256 388
       C 154 338 132 258 136 150
       C 162 148 214 144 256 122 Z"
    fill="none"
    stroke="rgba(255,255,255,0.4)"
    stroke-width="38"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#shield-glow)"
  />

  <!-- Primary Shield Geometry -->
  <path
    d="M 256 122
       C 298 144 350 148 376 150
       C 380 258 358 338 256 388
       C 154 338 132 258 136 150
       C 162 148 214 144 256 122 Z"
    fill="url(#shield-inner-grad)"
    stroke="#ffffff"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>